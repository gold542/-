<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预约后台 | 轩辕租车</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="admin-page">
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">轩</span>
      <span>轩辕租车后台</span>
    </a>
    <nav class="nav-links" aria-label="后台导航">
      <a href="index.html">网站首页</a>
      <a href="#bookings">预约记录</a>
      <a href="#contacts">联系需求</a>
    </nav>
    <div class="admin-actions">
      <button class="nav-action admin-refresh" id="refreshButton" type="button">刷新数据</button>
      <button class="nav-action admin-refresh" id="logoutButton" type="button">退出登录</button>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-hero">
      <p class="eyebrow">后台管理</p>
      <h1>用户预约与需求</h1>
      <p id="adminStatus">正在读取后端数据...</p>
    </section>

    <section class="admin-stats" aria-label="数据概览">
      <article>
        <span id="bookingCount">0</span>
        <p>预约记录</p>
      </article>
      <article>
        <span id="contactCount">0</span>
        <p>联系需求</p>
      </article>
      <article>
        <span id="totalAmount">¥0</span>
        <p>预约金额</p>
      </article>
    </section>

    <section class="admin-panel" id="bookings" aria-labelledby="bookings-title">
      <div class="admin-panel-head">
        <div>
          <p class="eyebrow">Bookings</p>
          <h2 id="bookings-title">预约记录</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>订单号</th>
              <th>城市</th>
              <th>车型</th>
              <th>取车</th>
              <th>还车</th>
              <th>天数</th>
              <th>金额</th>
              <th>提交时间</th>
            </tr>
          </thead>
          <tbody id="bookingRows"></tbody>
        </table>
      </div>
    </section>

    <section class="admin-panel" id="contacts" aria-labelledby="contacts-title">
      <div class="admin-panel-head">
        <div>
          <p class="eyebrow">Leads</p>
          <h2 id="contacts-title">联系需求</h2>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>编号</th>
              <th>姓名</th>
              <th>手机</th>
              <th>需求</th>
              <th>提交时间</th>
            </tr>
          </thead>
          <tbody id="contactRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="assets/js/admin.js"></script>
</body>
</html>
