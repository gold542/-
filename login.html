<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 | 轩辕租车</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <a class="brand" href="index.html">
        <span class="brand-mark">轩</span>
        <span>轩辕租车后台</span>
      </a>
      <div class="login-heading">
        <p class="eyebrow">Admin Login</p>
        <h1>账号登录</h1>
        <p>登录后查看用户预约和联系需求。</p>
      </div>
      <form class="login-form" id="loginForm">
        <label>
          账号
          <input name="username" type="text" value="admin" autocomplete="username" required>
        </label>
        <label>
          密码
          <input name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
        </label>
        <button type="submit">登录后台</button>
        <a class="back-home" href="index.html">返回网站首页</a>
        <p class="form-note" id="loginNote" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="assets/js/login.js"></script>
</body>
</html>
